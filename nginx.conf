# ============================================================================
# B2 文件管理 - nginx 反向代理配置（server 块）
#
# 用法：
#   Linux (Debian/Ubuntu):
#     sudo cp nginx.conf /etc/nginx/sites-available/b2-web
#     sudo ln -s /etc/nginx/sites-available/b2-web /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
#   macOS (Homebrew):
#     cp nginx.conf /opt/homebrew/etc/nginx/servers/b2-web.conf
#     nginx -t && nginx -s reload
#
# 默认监听 8080（普通用户无需 root 即可绑定）；如需 80/443 请自行修改。
# 后端 gunicorn 监听 127.0.0.1:8000（见 supervisor.conf）。
# ============================================================================

server {
    listen 8080;
    server_name b2-web.local;   # 改成你的域名或 IP

    # 大文件上传不限制大小（文件流式转发，由后端队列处理）
    client_max_body_size 0;

    # 上传请求流式转发给 gunicorn，避免 nginx 先把整个文件缓冲到磁盘
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传/下载大文件需要较长超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
