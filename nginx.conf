# ============================================================================
# BucketHub - nginx 反向代理配置（server 块）
#
# 架构：前端 React (Vite) + 后端 Flask (gunicorn)
#   - 前端：web/ 目录，开发用 Vite dev server (5173)，生产用 web/dist/
#   - 后端：gunicorn 监听 127.0.0.1:8000（见 supervisor.conf，必须 --workers 1）
#
# 两种部署模式（按需启用其一）：
#
# 【开发】Vite dev server：前端由 Vite 实时服务，/api 等反代到后端
#   location /            → http://127.0.0.1:5173   （取消注释 DEV 段）
#   （此时 Vite 自带 proxy 已处理 /api，nginx 只需透传到 5173 即可）
#
# 【生产】静态托管构建产物：nginx 直接 serve web/dist/
#   location /            → root web/dist; try_files （默认启用 PROD 段）
#
# 用法：
#   Linux (Debian/Ubuntu):
#     sudo cp nginx.conf /etc/nginx/sites-available/buckethub
#     sudo ln -s /etc/nginx/sites-available/buckethub /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#   macOS (Homebrew):
#     cp nginx.conf /opt/homebrew/etc/nginx/servers/buckethub.conf
#     nginx -t && nginx -s reload
#
# 默认监听 8080（普通用户无需 root 即可绑定）；如需 80/443 请自行修改。
# ============================================================================

server {
    listen 8080;
    server_name buckethub.local;   # 改成你的域名或 IP

    # 大文件上传不限制大小（文件流式转发，由后端队列处理）
    client_max_body_size 0;

    # 上传请求流式转发给 gunicorn，避免 nginx 先把整个文件缓冲到磁盘
    proxy_request_buffering off;

    # ──────────────────────────────────────────────────────────────────────
    # 后端接口与上传/下载路由（dev / prod 通用，始终反代到 gunicorn）
    # ──────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 表单提交类路由（无 /api 前缀）：/upload /server-upload /server-download /url-upload /scripts
    location ~ ^/(upload|server-upload|server-download|url-upload|scripts) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # 从 Bucket 流式下载给浏览器（带 apikey query）
    location /download {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # WebSocket 实时推送（上传任务状态，Socket.IO）
    location /socket.io {
        proxy_pass http://127.0.0.1:8000/socket.io;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ──────────────────────────────────────────────────────────────────────
    # 【生产】前端静态资源：托管 Vite 构建产物 web/dist/
    #   构建命令：cd web && pnpm build   （产物在 web/dist/）
    #   注意 root 路径需指向项目的 web/dist 绝对路径，按实际部署修改。
    # ──────────────────────────────────────────────────────────────────────
    root /Users/wade/web/app/test/script/web/dist;

    location / {
        # SPA：所有未命中的前端路由回退到 index.html
        try_files $uri $uri/ /index.html;
    }

    # 构建产物里的 /assets/* 静态文件（JS/CSS，带 hash，可长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ──────────────────────────────────────────────────────────────────────
    # 【开发】若用 Vite dev server，注释掉上面的 PROD location / 块，改用：
    # ──────────────────────────────────────────────────────────────────────
    # location / {
    #     proxy_pass http://127.0.0.1:5173;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     # Vite HMR 需 WebSocket
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }
}
