; ============================================================================
; B2 文件管理 - supervisor 配置（program 块）
;
; 用法：
;   Linux: cp supervisor.conf /etc/supervisor/conf.d/b2-web.conf
;          supervisorctl reread && supervisorctl update
;   macOS: cp supervisor.conf /opt/homebrew/etc/supervisor.d/b2-web.conf
;          supervisorctl reread && supervisorctl update
;
; 注意：
;   - --workers 固定为 1：上传队列运行在进程内
;   - --threads 负责并发处理 HTTP 请求
;   - 下面两个路径按你的部署环境修改（项目目录、用户、日志目录）
; ============================================================================

[program:b2-web]
command=/Users/wade/web/app/test/script/.venv/bin/gunicorn --workers 1 --threads 8 --bind 127.0.0.1:8000 --timeout 3600 wsgi:app
directory=/Users/wade/web/app/test/script
user=wade
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
environment=PYTHONUNBUFFERED=1
stdout_logfile=/Users/wade/web/app/test/script/logs/b2-web.out.log
stderr_logfile=/Users/wade/web/app/test/script/logs/b2-web.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
